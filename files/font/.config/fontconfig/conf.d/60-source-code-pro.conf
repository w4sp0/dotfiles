<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
SPDX-FileCopyrightText: 2026 Radek Janik <cyberwassp@gmail.com>

SPDX-License-Identifier: AGPL-3.0-or-later

Resolve the generic 'monospace' family to Source Code Pro.

The X resources use the undefined cpp macro 'MONOSPACE' as the font family,
which xrdb leaves as a literal string that fontconfig matches to this generic
alias, so terminals, rofi, GTK applications and browsers all follow this file.
-->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Source Code Pro</family>
    </prefer>
  </alias>
</fontconfig>
