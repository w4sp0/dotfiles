## Light theme, neutral grey.
## Applied by: theme light
##
## Monochrome by design. Emphasis comes from reversing foreground and
## background rather than from hue, so the status line carries no colour
## cast and nothing competes with the content of the panes.
##
## The 16 colour palette is left at the terminal defaults, and several of
## those defaults are illegible on a light background, so this file names
## every colour outright rather than using black/red/green/etc.
##
##   #d4d4d4 ground      #c4c4c4 ground, sunk
##   #474747 graphite    #6b6b6b graphite, faded
##   #303030 graphite, deep
##   #bebebe rule        #808080 rule, active

set-option -g message-command-style 'fg=#303030,bg=#c4c4c4'
set-option -g message-style 'fg=#303030,bg=#c4c4c4'
set-option -g mode-style 'fg=#d4d4d4,bg=#5f5f5f'
set-option -g pane-active-border-style 'fg=#808080'
set-option -g pane-border-style 'fg=#bebebe'
set-option -g window-status-activity-style 'fg=#303030,bg=#d4d4d4'
set-option -g window-status-current-style 'fg=#d4d4d4,bg=#474747'
set-option -g status-style 'fg=#6b6b6b,bg=#d4d4d4'
set-option -g status-left '#{?client_prefix,#[bg=#474747]#[fg=#d4d4d4]+#[bg=#d4d4d4] ,  }#[bg=#d4d4d4]#[fg=#303030]#S #[fg=#6b6b6b]#I #[fg=#808080]#P'
set-option -g status-left-style 'fg=#303030,bg=#d4d4d4'
set-option -g status-right '#{tmux_mode_indicator} #[fg=#6b6b6b]#H #[fg=#808080]%H:%M:%S'
set-option -g status-right-style 'fg=#6b6b6b,bg=#d4d4d4'

## vim:set filetype=tmux:
